name: Android Validate

on:
  pull_request:
    paths:
      - "app/**"
      - "third_party/libretrodroid/**"
      - "third_party/fceumm/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew*"
      - "scripts/android/**"
      - "scripts/cores/**"
      - "tests/fixtures/**"
      - "docs/save-sync-spec.md"
      - "design/tokens/**"
      - "scripts/generate_theme_tokens.py"
      - ".github/workflows/android-*.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install pinned native build tools
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Check generated theme tokens are current
        run: python3 scripts/generate_theme_tokens.py --check
      - name: Test, lint, and build both package flavors
        run: ./gradlew testStandardDebugUnitTest testLegacyBridgeDebugUnitTest lintStandardDebug lintLegacyBridgeDebug assembleDebug
      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-reports
          path: app/build/reports/
          if-no-files-found: error

  native-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native capture, isolation, and checkpoint commits
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ndk: 27.2.12479018
          cmake: 3.22.1
          disable-animations: true
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed
            ./gradlew connectedStandardDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.bandoracer.rommio.domain.player.CoreCaptureFailureTest,io.github.bandoracer.rommio.domain.player.NativeEnvironmentIsolationTest,io.github.bandoracer.rommio.domain.player.NativeCheckpointCaptureTest,io.github.bandoracer.rommio.domain.player.ProgressSessionCoordinatorTest,io.github.bandoracer.rommio.domain.player.PlayerNativeStartupTest,io.github.bandoracer.rommio.domain.player.PackagedCoreArtifactsTest,io.github.bandoracer.rommio.domain.player.ProgressLaunchPlannerTest,io.github.bandoracer.rommio.domain.player.ApplicationProgressSessionTest,io.github.bandoracer.rommio.domain.player.PlayerScreenProgressTest,io.github.bandoracer.rommio.domain.progress.ProgressSyncTest,io.github.bandoracer.rommio.domain.progress.ProgressWorkspaceTest,io.github.bandoracer.rommio.domain.progress.ProgressHistoryTest,io.github.bandoracer.rommio.domain.progress.ApplicationProgressStorageTest,io.github.bandoracer.rommio.data.migration.MigrationRecoveryTest
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-capture-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: error
